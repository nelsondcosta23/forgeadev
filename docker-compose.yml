services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_INTERNAL_PROXY_KEY=${VITE_INTERNAL_PROXY_KEY}
    ports:
      - "3000"
    labels:
      - "coolify.port=3000"
    environment:
      - PORT=3000
      - POCKETBASE_URL=http://pb:8090
      - INTERNAL_PROXY_KEY=${INTERNAL_PROXY_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
    networks:
      - internal
    restart: always

  pb:
    image: ghcr.io/muchobien/pocketbase:latest
    ports:
      - "8118:8090"
    labels:
      - "coolify.port=8090"
    volumes:
      - pb_data:/pb_data
    networks:
      - internal
    restart: always

volumes:
  pb_data:

networks:
  internal:
    driver: bridge
