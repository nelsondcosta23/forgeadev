    <!-- Mermaid for diagrams -->
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
      mermaid.initialize({ 
        startOnLoad: true,
        theme: 'dark',
        themeVariables: {
          primaryColor: '#3b82f6',
          primaryTextColor: '#fff',
          primaryBorderColor: '#2563eb',
          lineColor: '#64748b',
          secondaryColor: '#f59e0b',
          tertiaryColor: '#4ade80',
          background: '#1e293b',
          mainBkg: '#0f172a',
          secondBkg: '#1e293b',
          tertiaryBkg: '#334155'
        }
      });
      
      // Observer to re-render mermaid diagrams when they appear
      const observer = new MutationObserver(() => {
        const diagrams = document.querySelectorAll('.mermaid-diagram pre');
        diagrams.forEach(pre => {
          if (!pre.classList.contains('mermaid-processed')) {
            const code = pre.textContent;
            const container = pre.parentElement;
            container.innerHTML = `<div class="mermaid">${code}</div>`;
            mermaid.run({ nodes: container.querySelectorAll('.mermaid') });
          }
        });
      });
      
      observer.observe(document.body, {
        childList: true,
        subtree: true
      });
    </script>
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
